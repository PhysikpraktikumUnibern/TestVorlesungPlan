<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Vorlesungsplanung</title>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f6f8;
            color: #222;
        }

        h1 {
            margin-bottom: 10px;
        }

        #status {
            margin-bottom: 20px;
            color: #666;
        }

        #fehler {
            color: red;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        #zurNaechsten {
            display: none;
            margin-bottom: 25px;
            padding: 10px 14px;
            border: 1px solid #bbb;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        #zurNaechsten:hover {
            background: #eee;
        }

        .vorlesung {
            border: 1px solid #bbb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            background: white;
            scroll-margin-top: 30px;
        }

        .vorlesung.vergangen {
            opacity: 0.75;
        }

        .vorlesung.naechste {
            border: 3px solid #405d6f;
        }

        .marker {
            display: none;
            margin: -20px -20px 18px -20px;
            padding: 8px 14px;
            background: #405d6f;
            color: white;
            font-weight: bold;
            font-size: 13px;
        }

        .vorlesung.naechste .marker {
            display: block;
        }

        .lektion {
            margin-top: 20px;
            padding: 15px;
            background: #f4f4f4;
            border-radius: 8px;
        }

        .versuch {
            margin: 8px 0;
            padding: 8px 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<h1>Vorlesungsplanung</h1>

<div id="status">
    Daten werden geladen …
</div>

<div id="fehler"></div>

<button id="zurNaechsten">
    Zur nächsten Vorlesung
</button>

<div id="inhalt"></div>


<script>

let naechsteVorlesungElement = null;


/*
    Wandelt z.B. "16.05.2026"
    in ein echtes JavaScript-Datum um.
*/
function datumAusDeutsch(text) {

    const teile = text.split(".");

    if (teile.length !== 3) {
        return null;
    }

    const tag = Number(teile[0]);
    const monat = Number(teile[1]) - 1;
    const jahr = Number(teile[2]);

    return new Date(jahr, monat, tag);
}


/*
    TESTDATUM

    Wir tun vorübergehend so,
    als wäre heute der 09.05.2026.

    Achtung:
    JavaScript zählt Monate ab 0.

    Januar   = 0
    Februar  = 1
    März     = 2
    April    = 3
    Mai      = 4
*/
function heuteOhneUhrzeit() {

    return new Date(
        2026,
        4,
        9
    );
}


async function ladePlanung() {

    try {

        // 1. index.json laden
        const indexAntwort =
            await fetch("index.json");

        if (!indexAntwort.ok) {

            throw new Error(
                "index.json konnte nicht geladen werden."
            );
        }

        const index =
            await indexAntwort.json();

        const container =
            document.getElementById("inhalt");

        const heute =
            heuteOhneUhrzeit();

        let naechsteGefunden =
            false;


        // 2. Alle Vorlesungen laden
        for (
            let i = 0;
            i < index.vorlesungen.length;
            i++
        ) {

            const eintrag =
                index.vorlesungen[i];

            const antwort =
                await fetch(eintrag.datei);

            if (!antwort.ok) {

                throw new Error(
                    "Vorlesungsdatei konnte nicht geladen werden: "
                    + eintrag.datei
                );
            }

            const vorlesung =
                await antwort.json();


            // Datum der Vorlesung bestimmen
            const vorlesungsDatum =
                datumAusDeutsch(
                    vorlesung.datum
                );


            // Vorlesungs-Element erzeugen
            const vorlesungsElement =
                document.createElement("div");

            vorlesungsElement.className =
                "vorlesung";

            vorlesungsElement.id =
                "vorlesung-" + i;


            // Vergangene Vorlesungen markieren
            if (
                vorlesungsDatum &&
                vorlesungsDatum < heute
            ) {

                vorlesungsElement
                    .classList
                    .add("vergangen");
            }


            /*
                Die erste Vorlesung,
                deren Datum heute oder
                später ist, wird als
                nächste Vorlesung markiert.
            */
            if (
                !naechsteGefunden &&
                vorlesungsDatum &&
                vorlesungsDatum >= heute
            ) {

                vorlesungsElement
                    .classList
                    .add("naechste");

                naechsteVorlesungElement =
                    vorlesungsElement;

                naechsteGefunden =
                    true;
            }


            vorlesungsElement.innerHTML = `

                <div class="marker">
                    NÄCHSTE VORLESUNG
                </div>

                <h2>
                    ${vorlesung.datum}
                    – Vorlesung ${vorlesung.vorlesung}
                </h2>

            `;


            // 3. Lektionen anzeigen
            for (
                const lektion
                of vorlesung.lektionen
            ) {

                const lektionsElement =
                    document.createElement("div");

                lektionsElement.className =
                    "lektion";

                lektionsElement.innerHTML = `
                    <h3>
                        Lektion ${lektion.lektion}
                    </h3>
                `;


                // 4. Versuche anzeigen
                for (
                    const versuch
                    of lektion.versuche
                ) {

                    const versuchsElement =
                        document.createElement("div");

                    versuchsElement.className =
                        "versuch";

                    versuchsElement.textContent =
                        versuch.reihenfolge
                        + " – "
                        + versuch.versuch;

                    lektionsElement.appendChild(
                        versuchsElement
                    );
                }


                vorlesungsElement.appendChild(
                    lektionsElement
                );
            }


            container.appendChild(
                vorlesungsElement
            );
        }


        document.getElementById(
            "status"
        ).textContent =
            "Alle Vorlesungsdaten erfolgreich geladen.";


        /*
            Wenn eine nächste Vorlesung
            gefunden wurde:
        */
        if (naechsteVorlesungElement) {

            const button =
                document.getElementById(
                    "zurNaechsten"
                );

            button.style.display =
                "inline-block";


            // Button zum Zurückspringen
            button.addEventListener(
                "click",
                function() {

                    naechsteVorlesungElement
                        .scrollIntoView({
                            behavior: "smooth",
                            block: "start"
                        });
                }
            );


            /*
                Nach dem vollständigen Laden
                automatisch zur nächsten
                Vorlesung springen.
            */
            setTimeout(
                function() {

                    naechsteVorlesungElement
                        .scrollIntoView({
                            behavior: "auto",
                            block: "start"
                        });

                },
                100
            );
        }

    }

    catch (fehler) {

        document.getElementById(
            "status"
        ).textContent =
            "Fehler beim Laden.";

        document.getElementById(
            "fehler"
        ).textContent =
            fehler.message;

        console.error(fehler);
    }
}


ladePlanung();

</script>

</body>
</html>

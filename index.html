<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Vorlesungsplanung</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .vorlesung {
            border: 1px solid #bbb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .lektion {
            margin-top: 20px;
            padding: 15px;
            background: #f4f4f4;
            border-radius: 8px;
        }

        .versuch {
            margin: 8px 0;
            padding: 8px 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        #fehler {
            color: red;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h1>Vorlesungsplanung</h1>

<div id="status">
    Daten werden geladen …
</div>

<div id="fehler"></div>

<div id="inhalt"></div>


<script>

async function ladePlanung() {

    try {

        // 1. Zuerst index.json laden
        const indexAntwort = await fetch("index.json");

        if (!indexAntwort.ok) {
            throw new Error("index.json konnte nicht geladen werden.");
        }

        const index = await indexAntwort.json();

        const container =
            document.getElementById("inhalt");


        // 2. Alle Vorlesungen aus index.json durchgehen
        for (const eintrag of index.vorlesungen) {

            // Die dort angegebene JSON-Datei laden
            const antwort = await fetch(eintrag.datei);

            if (!antwort.ok) {
                throw new Error(
                    "Vorlesungsdatei konnte nicht geladen werden: "
                    + eintrag.datei
                );
            }

            const vorlesung = await antwort.json();


            // 3. Vorlesung anzeigen
            const vorlesungsElement =
                document.createElement("div");

            vorlesungsElement.className = "vorlesung";

            vorlesungsElement.innerHTML = `
                <h2>
                    ${vorlesung.datum}
                    – Vorlesung ${vorlesung.vorlesung}
                </h2>
            `;


            // 4. Lektionen durchgehen
            for (const lektion of vorlesung.lektionen) {

                const lektionsElement =
                    document.createElement("div");

                lektionsElement.className = "lektion";

                lektionsElement.innerHTML = `
                    <h3>
                        Lektion ${lektion.lektion}
                    </h3>
                `;


                // 5. Versuche dieser Lektion
                for (const versuch of lektion.versuche) {

                    const versuchsElement =
                        document.createElement("div");

                    versuchsElement.className = "versuch";

                    versuchsElement.textContent =
                        versuch.reihenfolge
                        + " – "
                        + versuch.versuch;

                    lektionsElement.appendChild(
                        versuchsElement
                    );
                }


                vorlesungsElement.appendChild(
                    lektionsElement
                );
            }


            container.appendChild(
                vorlesungsElement
            );
        }


        document.getElementById("status").textContent =
            "Alle Vorlesungsdaten erfolgreich geladen.";

    }

    catch (fehler) {

        document.getElementById("status").textContent =
            "Fehler beim Laden.";

        document.getElementById("fehler").textContent =
            fehler.message;

        console.error(fehler);
    }
}


ladePlanung();

</script>

</body>
</html>

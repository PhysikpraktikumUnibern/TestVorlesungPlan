<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Vorlesungsplanung</title>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f6f8;
            color: #222;
        }

        h1 {
            margin-bottom: 10px;
        }

        #status {
            margin-bottom: 20px;
            color: #666;
        }

        #fehler {
            color: red;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        #zurNaechsten {
            display: none;
            margin-bottom: 25px;
            padding: 10px 14px;
            border: 1px solid #bbb;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        #zurNaechsten:hover {
            background: #eee;
        }

        .vorlesung {
            border: 1px solid #bbb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            background: white;
            scroll-margin-top: 30px;
        }

        .vorlesung.vergangen {
            opacity: 0.75;
        }

        .vorlesung.naechste {
            border: 3px solid #405d6f;
        }

        .marker {
            display: none;
            margin: -20px -20px 18px -20px;
            padding: 8px 14px;
            background: #405d6f;
            color: white;
            font-weight: bold;
            font-size: 13px;
        }

        .vorlesung.naechste .marker {
            display: block;
        }

        .lektion {
            margin-top: 20px;
            padding: 15px;
            background: #f4f4f4;
            border-radius: 8px;
        }

        .versuch {
            margin: 8px 0;
            padding: 10px 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
        }

        .versuch:hover {
            background: #eef2f4;
        }

        .versuch.aktiv {
            border-color: #405d6f;
            background: #eef2f4;
        }

        .versuch-kopf {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
        }

        .versuch-pfeil {
            font-size: 18px;
            color: #666;
        }

        .versuch-detail {
            display: none;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #ddd;
        }

        .versuch.aktiv .versuch-detail {
            display: block;
        }

        .versuch-text {
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .versuch-bild {
            max-width: 100%;
            max-height: 450px;
            object-fit: contain;
            display: block;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: white;
        }

        .kein-bild {
            color: #777;
            font-style: italic;
        }
    </style>
</head>

<body>

<h1>Vorlesungsplanung</h1>

<div id="status">
    Daten werden geladen …
</div>

<div id="fehler"></div>

<button id="zurNaechsten">
    Zur nächsten Vorlesung
</button>

<div id="inhalt"></div>


<script>

let naechsteVorlesungElement = null;


/*
    Deutsches Datum wie 16.05.2026
    in JavaScript-Datum umwandeln
*/
function datumAusDeutsch(text) {

    const teile = text.split(".");

    if (teile.length !== 3) {
        return null;
    }

    const tag = Number(teile[0]);
    const monat = Number(teile[1]) - 1;
    const jahr = Number(teile[2]);

    return new Date(jahr, monat, tag);
}


/*
    TESTDATUM:
    09.05.2026
*/
function heuteOhneUhrzeit() {

    return new Date(
        2026,
        4,
        9
    );
}


/*
    Detailbereich eines Versuchs
*/
function erzeugeVersuchsElement(versuch) {

    const versuchsElement =
        document.createElement("div");

    versuchsElement.className =
        "versuch";


    const kopf =
        document.createElement("div");

    kopf.className =
        "versuch-kopf";


    const titel =
        document.createElement("div");

    titel.textContent =
        versuch.reihenfolge
        + " – "
        + versuch.versuch;


    const pfeil =
        document.createElement("div");

    pfeil.className =
        "versuch-pfeil";

    pfeil.textContent =
        "▾";


    kopf.appendChild(titel);
    kopf.appendChild(pfeil);


    const detail =
        document.createElement("div");

    detail.className =
        "versuch-detail";


    const text =
        document.createElement("div");

    text.className =
        "versuch-text";

    text.textContent =
        versuch.text || "Keine Beschreibung vorhanden.";

    detail.appendChild(text);


    if (
        versuch.bild_vorhanden === 1 &&
        versuch.bild
    ) {

        const bild =
            document.createElement("img");

        bild.className =
            "versuch-bild";

        bild.src =
            versuch.bild;

        bild.alt =
            versuch.versuch;

        detail.appendChild(bild);

    } else {

        const keinBild =
            document.createElement("div");

        keinBild.className =
            "kein-bild";

        keinBild.textContent =
            "Kein Bild vorhanden.";

        detail.appendChild(keinBild);
    }


    versuchsElement.appendChild(kopf);
    versuchsElement.appendChild(detail);


    versuchsElement.addEventListener(
        "click",
        function() {

            const istAktiv =
                versuchsElement
                    .classList
                    .contains("aktiv");


            if (istAktiv) {

                versuchsElement
                    .classList
                    .remove("aktiv");

                pfeil.textContent =
                    "▾";

            } else {

                versuchsElement
                    .classList
                    .add("aktiv");

                pfeil.textContent =
                    "▴";
            }
        }
    );


    return versuchsElement;
}


async function ladePlanung() {

    try {

        const indexAntwort =
            await fetch(
                "index.json",
                { cache: "no-store" }
            );

        if (!indexAntwort.ok) {

            throw new Error(
                "index.json konnte nicht geladen werden."
            );
        }

        const index =
            await indexAntwort.json();

        const container =
            document.getElementById("inhalt");

        const heute =
            heuteOhneUhrzeit();

        let naechsteGefunden =
            false;


        for (
            let i = 0;
            i < index.vorlesungen.length;
            i++
        ) {

            const eintrag =
                index.vorlesungen[i];

            const antwort =
                await fetch(
                    eintrag.datei,
                    { cache: "no-store" }
                );

            if (!antwort.ok) {

                throw new Error(
                    "Vorlesungsdatei konnte nicht geladen werden: "
                    + eintrag.datei
                );
            }

            const vorlesung =
                await antwort.json();


            const vorlesungsDatum =
                datumAusDeutsch(
                    vorlesung.datum
                );


            const vorlesungsElement =
                document.createElement("div");

            vorlesungsElement.className =
                "vorlesung";

            vorlesungsElement.id =
                "vorlesung-" + i;


            if (
                vorlesungsDatum &&
                vorlesungsDatum < heute
            ) {

                vorlesungsElement
                    .classList
                    .add("vergangen");
            }


            if (
                !naechsteGefunden &&
                vorlesungsDatum &&
                vorlesungsDatum >= heute
            ) {

                vorlesungsElement
                    .classList
                    .add("naechste");

                naechsteVorlesungElement =
                    vorlesungsElement;

                naechsteGefunden =
                    true;
            }


            vorlesungsElement.innerHTML = `

                <div class="marker">
                    NÄCHSTE VORLESUNG
                </div>

                <h2>
                    ${vorlesung.datum}
                    – Vorlesung ${vorlesung.vorlesung}
                </h2>

            `;


            for (
                const lektion
                of vorlesung.lektionen
            ) {

                const lektionsElement =
                    document.createElement("div");

                lektionsElement.className =
                    "lektion";

                lektionsElement.innerHTML = `
                    <h3>
                        Lektion ${lektion.lektion}
                    </h3>
                `;


                for (
                    const versuch
                    of lektion.versuche
                ) {

                    const versuchsElement =
                        erzeugeVersuchsElement(
                            versuch
                        );

                    lektionsElement.appendChild(
                        versuchsElement
                    );
                }


                vorlesungsElement.appendChild(
                    lektionsElement
                );
            }


            container.appendChild(
                vorlesungsElement
            );
        }


        document.getElementById(
            "status"
        ).textContent =
            "Alle Vorlesungsdaten erfolgreich geladen.";


        if (naechsteVorlesungElement) {

            const button =
                document.getElementById(
                    "zurNaechsten"
                );

            button.style.display =
                "inline-block";

            button.addEventListener(
                "click",
                function() {

                    naechsteVorlesungElement
                        .scrollIntoView({
                            behavior: "smooth",
                            block: "start"
                        });
                }
            );


            setTimeout(
                function() {

                    naechsteVorlesungElement
                        .scrollIntoView({
                            behavior: "auto",
                            block: "start"
                        });

                },
                100
            );
        }

    }

    catch (fehler) {

        document.getElementById(
            "status"
        ).textContent =
            "Fehler beim Laden.";

        document.getElementById(
            "fehler"
        ).textContent =
            fehler.message;

        console.error(
            fehler
        );
    }
}


ladePlanung();

</script>

</body>
</html>

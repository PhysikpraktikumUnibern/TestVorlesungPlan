<!DOCTYPE html>
<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vorlesungsplanung</title>

    <style>

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1500px;
            margin: 30px auto;
            padding: 0 20px;
            background: #f4f6f8;
            color: #222;
        }

        h1 {
            margin-bottom: 8px;
        }

        #status {
            color: #666;
            margin-bottom: 18px;
        }

        #fehler {
            color: #b00020;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }


        /* --------------------------------------------------
           Bedienung oben
        -------------------------------------------------- */

        .steuerung {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 28px;
        }

        button {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #aaa;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #eef1f3;
        }

        #vergleichButton {
            display: none;
        }

        #naechsteButton {
            display: none;
        }


        /* --------------------------------------------------
           Tagesblock
        -------------------------------------------------- */

        .tag {
            margin-bottom: 38px;
            scroll-margin-top: 25px;
        }

        .tag-datum {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .tag-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }

        .tag-grid.zwei {
            grid-template-columns: 1fr 1fr;
        }


        /* --------------------------------------------------
           Vorlesung
        -------------------------------------------------- */

        .vorlesung {
            border-radius: 12px;
            background: white;
            overflow: hidden;
            border: 2px solid #b7c0c6;
        }


        /* Eigene Stammvorlesungsserie */

        .vorlesung.eigen {
            border-color: #405d6f;
        }

        .vorlesung.eigen .vorlesung-kopf {
            background: #edf3f6;
        }


        /* Vergleichs-/Tochterserie */

        .vorlesung.vergleich {
            border-color: #b87932;
        }

        .vorlesung.vergleich .vorlesung-kopf {
            background: #fff4e7;
        }


        /* Vergangene Termine */

        .vorlesung.vergangen {
            opacity: 0.76;
        }


        /* Nächste eigene Vorlesung */

        .vorlesung.naechste {
            box-shadow: 0 0 0 4px rgba(64, 93, 111, 0.18);
        }


        .vorlesung-kopf {
            padding: 15px 18px;
            border-bottom: 1px solid #ddd;
        }

        .vorlesung-kopf h2 {
            margin: 0 0 7px 0;
        }

        .serien-hinweis {
            display: inline-block;
            font-size: 12px;
            font-weight: bold;
            padding: 5px 8px;
            border-radius: 6px;
        }

        .serien-hinweis.eigen {
            color: #405d6f;
            background: #dfeaf0;
        }

        .serien-hinweis.vergleich {
            color: #925c20;
            background: #ffe4c4;
        }

        .naechste-marker {
            display: inline-block;
            margin-left: 8px;
            font-size: 12px;
            font-weight: bold;
            padding: 5px 8px;
            border-radius: 6px;
            background: #405d6f;
            color: white;
        }


        /* --------------------------------------------------
           Lektionen
        -------------------------------------------------- */

        .lektion {
            margin: 14px;
            padding: 14px;
            background: #f5f6f7;
            border-radius: 8px;
        }

        .lektion h3 {
            margin-top: 0;
            margin-bottom: 12px;
        }


        /* --------------------------------------------------
           Versuch
        -------------------------------------------------- */

        .versuch {
            margin: 8px 0;
            padding: 10px 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
        }

        .versuch:hover {
            background: #f0f3f5;
        }

        .versuch.aktiv {
            border-color: #607d8b;
            background: #f1f5f7;
        }

        .versuch-kopf {
            display: grid;
            grid-template-columns: 70px 1fr 24px;
            gap: 10px;
            align-items: center;
        }

        .reihenfolge {
            font-weight: bold;
            color: #405d6f;
        }

        .versuch-name {
            font-weight: 600;
        }

        .pfeil {
            text-align: right;
            color: #666;
        }


        /* --------------------------------------------------
           Versuchdetails
        -------------------------------------------------- */

        .versuch-detail {
            display: none;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #ddd;
        }

        .versuch.aktiv .versuch-detail {
            display: grid;
            grid-template-columns: minmax(220px, 38%) 1fr;
            gap: 18px;
        }

        .versuch-bild {
            width: 100%;
            max-height: 380px;
            object-fit: contain;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .versuch-text {
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .kein-bild {
            color: #777;
            font-style: italic;
        }


        /* --------------------------------------------------
           Kleine Bildschirme
        -------------------------------------------------- */

        @media (max-width: 950px) {

            .tag-grid.zwei {
                grid-template-columns: 1fr;
            }

            .versuch.aktiv .versuch-detail {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>


<body>


<h1>Vorlesungsplanung</h1>

<div id="status">
    Daten werden geladen …
</div>

<div id="fehler"></div>


<div class="steuerung">

    <button id="naechsteButton">
        Zur nächsten Vorlesung
    </button>

    <button id="vergleichButton">
        Schwester-Vorlesung einblenden
    </button>

</div>


<div id="inhalt"></div>


<script>


/* ==========================================================
   GLOBALE VARIABLEN
========================================================== */

let indexDaten = null;

let eigeneSerie = null;

let vergleichsSerie = null;

let vergleichAnzeigen = false;

let naechstesElement = null;



/* ==========================================================
   SERIE AUS DER URL HOLEN

   Beispiel:
   ?serie=6
========================================================== */

const parameter =
    new URLSearchParams(
        window.location.search
    );

eigeneSerie =
    Number(
        parameter.get("serie")
    );



/* ==========================================================
   DATUM TT.MM.JJJJ → JavaScript Date
========================================================== */

function datumAusDeutsch(text) {

    if (!text) {
        return null;
    }

    const teile =
        text.split(".");

    if (teile.length !== 3) {
        return null;
    }

    return new Date(
        Number(teile[2]),
        Number(teile[1]) - 1,
        Number(teile[0])
    );
}



/* ==========================================================
   HEUTIGES DATUM

   Für den produktiven Betrieb wird hier das echte
   Datum des Geräts verwendet.
========================================================== */

function heuteOhneUhrzeit() {

    const jetzt =
        new Date();

    return new Date(
        jetzt.getFullYear(),
        jetzt.getMonth(),
        jetzt.getDate()
    );
}



/* ==========================================================
   VORLESUNGSDATEI LADEN
========================================================== */

async function ladeVorlesungsDatei(eintrag) {

    const antwort =
        await fetch(
            eintrag.datei,
            {
                cache: "no-store"
            }
        );

    if (!antwort.ok) {

        throw new Error(
            "Vorlesungsdatei konnte nicht geladen werden: "
            + eintrag.datei
        );
    }

    return await antwort.json();
}



/* ==========================================================
   VERSUCH ERZEUGEN
========================================================== */

function erzeugeVersuch(versuch) {

    const element =
        document.createElement("div");

    element.className =
        "versuch";


    const kopf =
        document.createElement("div");

    kopf.className =
        "versuch-kopf";


    const reihenfolge =
        document.createElement("div");

    reihenfolge.className =
        "reihenfolge";

    reihenfolge.textContent =
        versuch.reihenfolge || "";


    const name =
        document.createElement("div");

    name.className =
        "versuch-name";

    name.textContent =
        versuch.versuch || "";


    const pfeil =
        document.createElement("div");

    pfeil.className =
        "pfeil";

    pfeil.textContent =
        "▾";


    kopf.appendChild(
        reihenfolge
    );

    kopf.appendChild(
        name
    );

    kopf.appendChild(
        pfeil
    );


    /* -----------------------
       Detailbereich
    ----------------------- */

    const detail =
        document.createElement("div");

    detail.className =
        "versuch-detail";


    const bildBereich =
        document.createElement("div");


    if (
        versuch.bild_vorhanden === 1
        &&
        versuch.bild
    ) {

        const bild =
            document.createElement("img");

        bild.className =
            "versuch-bild";

        bild.src =
            versuch.bild;

        bild.alt =
            versuch.versuch || "Versuchsbild";

        bildBereich.appendChild(
            bild
        );

    } else {

        const keinBild =
            document.createElement("div");

        keinBild.className =
            "kein-bild";

        keinBild.textContent =
            "Kein Bild vorhanden.";

        bildBereich.appendChild(
            keinBild
        );
    }


    const text =
        document.createElement("div");

    text.className =
        "versuch-text";

    text.textContent =
        versuch.text
        ||
        "Keine Beschreibung vorhanden.";


    detail.appendChild(
        bildBereich
    );

    detail.appendChild(
        text
    );


    element.appendChild(
        kopf
    );

    element.appendChild(
        detail
    );


    /* -----------------------
       Öffnen / Schliessen
    ----------------------- */

    element.addEventListener(
        "click",
        function() {

            const aktiv =
                element
                    .classList
                    .toggle("aktiv");

            pfeil.textContent =
                aktiv
                ? "▴"
                : "▾";
        }
    );


    return element;
}



/* ==========================================================
   VORLESUNGSKARTE ERZEUGEN
========================================================== */

function erzeugeVorlesung(
    eintrag,
    daten,
    typ,
    istNaechste
) {

    const heute =
        heuteOhneUhrzeit();

    const datum =
        datumAusDeutsch(
            eintrag.datum
        );


    const element =
        document.createElement("article");

    element.className =
        "vorlesung " + typ;


    if (
        datum
        &&
        datum < heute
    ) {

        element.classList.add(
            "vergangen"
        );
    }


    if (istNaechste) {

        element.classList.add(
            "naechste"
        );
    }


    /* -----------------------
       Kopf
    ----------------------- */

    const kopf =
        document.createElement("div");

    kopf.className =
        "vorlesung-kopf";


    const titel =
        document.createElement("h2");

    titel.textContent =
        "Vorlesung "
        + daten.vorlesung;


    const serienHinweis =
        document.createElement("span");

    serienHinweis.className =
        "serien-hinweis "
        + typ;


    if (typ === "eigen") {

        serienHinweis.textContent =
            "Ihre Vorlesungsserie";

    } else {

        serienHinweis.textContent =
            "Schwester-Vorlesung";
    }


    kopf.appendChild(
        titel
    );

    kopf.appendChild(
        serienHinweis
    );


    if (istNaechste) {

        const marker =
            document.createElement("span");

        marker.className =
            "naechste-marker";

        marker.textContent =
            "NÄCHSTE VORLESUNG";

        kopf.appendChild(
            marker
        );
    }


    element.appendChild(
        kopf
    );


    /* -----------------------
       Lektionen
    ----------------------- */

    for (
        const lektion
        of daten.lektionen
    ) {

        const lektionsElement =
            document.createElement("div");

        lektionsElement.className =
            "lektion";


        const titel =
            document.createElement("h3");

        titel.textContent =
            "Lektion "
            + lektion.lektion;


        lektionsElement.appendChild(
            titel
        );


        for (
            const versuch
            of lektion.versuche
        ) {

            lektionsElement.appendChild(
                erzeugeVersuch(
                    versuch
                )
            );
        }


        element.appendChild(
            lektionsElement
        );
    }


    return element;
}



/* ==========================================================
   VERGLEICHSSERIE BESTIMMEN
========================================================== */

function bestimmeVergleichsSerie(
    eigeneEintraege
) {

    for (
        const eintrag
        of eigeneEintraege
    ) {

        if (
            eintrag.vergleichsserie !== undefined
            &&
            eintrag.vergleichsserie !== null
            &&
            Number(eintrag.vergleichsserie) !== 0
        ) {

            return Number(
                eintrag.vergleichsserie
            );
        }
    }


    return null;
}



/* ==========================================================
   PLANUNG ANZEIGEN
========================================================== */

async function zeichnePlanung() {

    const container =
        document.getElementById(
            "inhalt"
        );

    container.innerHTML =
        "";

    naechstesElement =
        null;


    const heute =
        heuteOhneUhrzeit();


    /* -----------------------
       Eigene Serie
    ----------------------- */

    const eigeneEintraege =
        indexDaten.vorlesungen.filter(

            eintrag =>
                Number(
                    eintrag.stammserie
                )
                === eigeneSerie
        );


    if (
        eigeneEintraege.length === 0
    ) {

        throw new Error(
            "Für die Stammvorlesungsserie "
            + eigeneSerie
            + " wurden keine Vorlesungen im Index gefunden."
        );
    }


    eigeneEintraege.sort(
        (a, b) =>
            datumAusDeutsch(a.datum)
            -
            datumAusDeutsch(b.datum)
    );


    /* -----------------------
       Vergleichsserie
    ----------------------- */

    vergleichsSerie =
        bestimmeVergleichsSerie(
            eigeneEintraege
        );


    let vergleichsEintraege =
        [];


    if (
        vergleichAnzeigen
        &&
        vergleichsSerie !== null
    ) {

        vergleichsEintraege =
            indexDaten.vorlesungen.filter(

                eintrag =>
                    Number(
                        eintrag.stammserie
                    )
                    === vergleichsSerie
            );


        vergleichsEintraege.sort(
            (a, b) =>
                datumAusDeutsch(a.datum)
                -
                datumAusDeutsch(b.datum)
        );
    }


    /* -----------------------
       Alle sichtbaren Einträge
       zusammenführen
    ----------------------- */

    const sichtbareEintraege =
        [];


    for (
        const eintrag
        of eigeneEintraege
    ) {

        sichtbareEintraege.push({
            ...eintrag,
            typ: "eigen"
        });
    }


    if (vergleichAnzeigen) {

        for (
            const eintrag
            of vergleichsEintraege
        ) {

            sichtbareEintraege.push({
                ...eintrag,
                typ: "vergleich"
            });
        }
    }


    /* -----------------------
       Chronologisch sortieren

       Wenn Datum identisch:
       eigene Serie zuerst
    ----------------------- */

    sichtbareEintraege.sort(
        function(a, b) {

            const datumA =
                datumAusDeutsch(
                    a.datum
                );

            const datumB =
                datumAusDeutsch(
                    b.datum
                );


            if (
                datumA.getTime()
                !==
                datumB.getTime()
            ) {

                return datumA - datumB;
            }


            if (
                a.typ === "eigen"
                &&
                b.typ === "vergleich"
            ) {

                return -1;
            }


            if (
                a.typ === "vergleich"
                &&
                b.typ === "eigen"
            ) {

                return 1;
            }


            return 0;
        }
    );


    /* -----------------------
       Nächste EIGENE Vorlesung
       bestimmen
    ----------------------- */

    let naechsterEigenerEintrag =
        null;


    for (
        const eintrag
        of eigeneEintraege
    ) {

        const datum =
            datumAusDeutsch(
                eintrag.datum
            );


        if (
            datum
            &&
            datum >= heute
        ) {

            naechsterEigenerEintrag =
                eintrag;

            break;
        }
    }


    /* -----------------------
       Nach Datum gruppieren
    ----------------------- */

    const tage =
        new Map();


    for (
        const eintrag
        of sichtbareEintraege
    ) {

        if (
            !tage.has(
                eintrag.datum
            )
        ) {

            tage.set(
                eintrag.datum,
                []
            );
        }


        tage
            .get(eintrag.datum)
            .push(eintrag);
    }


    /* -----------------------
       Tagesblöcke zeichnen
    ----------------------- */

    for (
        const [datumText, eintraege]
        of tage
    ) {

        const tag =
            document.createElement(
                "section"
            );

        tag.className =
            "tag";


        const datumTitel =
            document.createElement(
                "div"
            );

        datumTitel.className =
            "tag-datum";

        datumTitel.textContent =
            datumText;


        const grid =
            document.createElement(
                "div"
            );

        grid.className =
            "tag-grid";


        /*
            Wenn am selben Tag eigene +
            Vergleichsserie vorhanden sind:
            nebeneinander anzeigen.
        */

        const hatEigen =
            eintraege.some(
                e => e.typ === "eigen"
            );

        const hatVergleich =
            eintraege.some(
                e => e.typ === "vergleich"
            );


        if (
            hatEigen
            &&
            hatVergleich
        ) {

            grid.classList.add(
                "zwei"
            );
        }


        /* -----------------------
           Dateien dieses Tages
           laden
        ----------------------- */

        for (
            const eintrag
            of eintraege
        ) {

            const daten =
                await ladeVorlesungsDatei(
                    eintrag
                );


            const istNaechste =
                eintrag.typ === "eigen"
                &&
                naechsterEigenerEintrag
                &&
                eintrag.datei
                    ===
                naechsterEigenerEintrag.datei;


            const vorlesung =
                erzeugeVorlesung(
                    eintrag,
                    daten,
                    eintrag.typ,
                    istNaechste
                );


            if (istNaechste) {

                naechstesElement =
                    vorlesung;
            }


            grid.appendChild(
                vorlesung
            );
        }


        tag.appendChild(
            datumTitel
        );

        tag.appendChild(
            grid
        );

        container.appendChild(
            tag
        );
    }


    /* -----------------------
       Buttons
    ----------------------- */

    const vergleichButton =
        document.getElementById(
            "vergleichButton"
        );


    if (
        vergleichsSerie !== null
    ) {

        vergleichButton.style.display =
            "inline-block";

        vergleichButton.textContent =
            vergleichAnzeigen
            ? "Schwester-Vorlesung ausblenden"
            : "Schwester-Vorlesung einblenden";

    } else {

        vergleichButton.style.display =
            "none";
    }


    const naechsteButton =
        document.getElementById(
            "naechsteButton"
        );


    if (naechstesElement) {

        naechsteButton.style.display =
            "inline-block";

    } else {

        naechsteButton.style.display =
            "none";
    }

}



/* ==========================================================
   HAUPTFUNKTION
========================================================== */

async function starteSeite() {

    try {

        /* -----------------------
           URL prüfen
        ----------------------- */

        if (
            !eigeneSerie
            ||
            Number.isNaN(
                eigeneSerie
            )
        ) {

            throw new Error(
                "In der Adresse fehlt die Stammvorlesungsserie.\n\n"
                +
                "Beispiel:\n"
                +
                "?serie=6"
            );
        }


        /* -----------------------
           Index laden
        ----------------------- */

        const antwort =
            await fetch(
                "index.json",
                {
                    cache: "no-store"
                }
            );


        if (!antwort.ok) {

            throw new Error(
                "index.json konnte nicht geladen werden."
            );
        }


        indexDaten =
            await antwort.json();


        /* -----------------------
           Vergleichsbutton
        ----------------------- */

        document
            .getElementById(
                "vergleichButton"
            )
            .addEventListener(
                "click",
                async function() {

                    vergleichAnzeigen =
                        !vergleichAnzeigen;


                    document
                        .getElementById(
                            "status"
                        )
                        .textContent =
                            vergleichAnzeigen
                            ? "Schwester-Vorlesung wird geladen …"
                            : "Schwester-Vorlesung wird ausgeblendet …";


                    await zeichnePlanung();


                    document
                        .getElementById(
                            "status"
                        )
                        .textContent =
                            "Vorlesungsplanung";
                }
            );


        /* -----------------------
           Nächste Vorlesung
        ----------------------- */

        document
            .getElementById(
                "naechsteButton"
            )
            .addEventListener(
                "click",
                function() {

                    if (
                        naechstesElement
                    ) {

                        naechstesElement
                            .scrollIntoView({
                                behavior:
                                    "smooth",

                                block:
                                    "start"
                            });
                    }
                }
            );


        /* -----------------------
           Erste Darstellung
        ----------------------- */

        await zeichnePlanung();


        document
            .getElementById(
                "status"
            )
            .textContent =
                "Stammvorlesungsserie "
                + eigeneSerie;


        /*
            Automatisch zur nächsten
            eigenen Vorlesung springen.
        */

        if (
            naechstesElement
        ) {

            setTimeout(
                function() {

                    naechstesElement
                        .scrollIntoView({
                            behavior:
                                "auto",

                            block:
                                "start"
                        });

                },
                100
            );
        }

    }


    catch (fehler) {

        document
            .getElementById(
                "status"
            )
            .textContent =
                "Fehler";


        document
            .getElementById(
                "fehler"
            )
            .textContent =
                fehler.message;


        console.error(
            fehler
        );
    }

}


starteSeite();


</script>

</body>
</html>

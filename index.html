<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Vorlesungsplanung</title>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1500px;
            margin: 30px auto;
            padding: 0 20px;
            background: #f4f6f8;
            color: #222;
        }

        h1 {
            margin-bottom: 8px;
        }

        #status {
            margin-bottom: 20px;
            color: #666;
        }

        #fehler {
            color: red;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        #zurNaechsten {
            display: none;
            margin-bottom: 25px;
            padding: 10px 14px;
            border: 1px solid #bbb;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        #zurNaechsten:hover {
            background: #eee;
        }

        .tag {
            margin-bottom: 36px;
            scroll-margin-top: 25px;
        }

        .tag.naechster-tag {
            outline: 3px solid #405d6f;
            outline-offset: 8px;
            border-radius: 12px;
        }

        .tag-marker {
            display: none;
            background: #405d6f;
            color: white;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .tag.naechster-tag .tag-marker {
            display: inline-block;
        }

        .tag-datum {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 14px;
        }

        .vorlesungs-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }

        .vorlesungs-grid.zwei {
            grid-template-columns: 1fr 1fr;
        }

        .vorlesung {
            border: 1px solid #bbb;
            border-radius: 12px;
            background: white;
            overflow: hidden;
        }

        .vorlesung.vergangen {
            opacity: 0.78;
        }

        .vorlesung.vergleich {
            border-color: #7a8790;
        }

        .vorlesung-kopf {
            padding: 16px 18px;
            border-bottom: 1px solid #ddd;
        }

        .vorlesung-kopf h2 {
            margin: 0 0 6px 0;
        }

        .serie-hinweis {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 8px;
            border-radius: 6px;
            background: #eef2f4;
            color: #53616b;
            font-size: 12px;
            font-weight: bold;
        }

        .serie-hinweis.vergleich {
            background: #eceff1;
            color: #5d6971;
        }

        .lektion {
            margin: 14px;
            padding: 14px;
            background: #f5f6f7;
            border-radius: 8px;
        }

        .lektion h3 {
            margin-top: 0;
        }

        .versuch {
            margin: 8px 0;
            padding: 10px 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
        }

        .versuch:hover {
            background: #eef2f4;
        }

        .versuch.aktiv {
            border-color: #405d6f;
            background: #eef2f4;
        }

        .versuch-kopf {
            display: grid;
            grid-template-columns: 70px 1fr 24px;
            gap: 10px;
            align-items: center;
        }

        .reihenfolge {
            font-weight: bold;
            color: #405d6f;
        }

        .versuch-name {
            font-weight: 600;
        }

        .versuch-pfeil {
            text-align: right;
            color: #666;
        }

        .versuch-detail {
            display: none;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #ddd;
        }

        .versuch.aktiv .versuch-detail {
            display: grid;
            grid-template-columns: minmax(220px, 38%) 1fr;
            gap: 18px;
        }

        .versuch-bild {
            width: 100%;
            max-height: 360px;
            object-fit: contain;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }

        .versuch-text {
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .kein-bild {
            color: #777;
            font-style: italic;
        }

        @media (max-width: 950px) {

            .vorlesungs-grid.zwei {
                grid-template-columns: 1fr;
            }

            .versuch.aktiv .versuch-detail {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<h1>Vorlesungsplanung</h1>

<div id="status">
    Daten werden geladen …
</div>

<div id="fehler"></div>

<button id="zurNaechsten">
    Zur nächsten Vorlesung
</button>

<div id="inhalt"></div>


<script>

let naechsterTagElement = null;


/*
    Datum im Format TT.MM.JJJJ
*/
function datumAusDeutsch(text) {

    const teile = text.split(".");

    if (teile.length !== 3) {
        return null;
    }

    const tag = Number(teile[0]);
    const monat = Number(teile[1]) - 1;
    const jahr = Number(teile[2]);

    return new Date(jahr, monat, tag);
}


/*
    TESTDATUM
    09.05.2026
*/
function heuteOhneUhrzeit() {

    return new Date(
        2026,
        4,
        9
    );
}


/*
    Prüfen, ob zwei Serien miteinander gekoppelt sind
*/
function serienGehörenZusammen(a, b) {

    if (!a || !b) {
        return false;
    }

    return (
        a.vergleichsserie === b.stammserie
        ||
        b.vergleichsserie === a.stammserie
    );
}


/*
    Einzelne Vorlesungsdatei laden
*/
async function ladeVorlesungsDatei(eintrag) {

    const antwort = await fetch(
        eintrag.datei,
        { cache: "no-store" }
    );

    if (!antwort.ok) {

        throw new Error(
            "Vorlesungsdatei konnte nicht geladen werden: "
            + eintrag.datei
        );
    }

    return await antwort.json();
}


/*
    Versuch erzeugen
*/
function erzeugeVersuchsElement(versuch) {

    const versuchsElement =
        document.createElement("div");

    versuchsElement.className =
        "versuch";


    const kopf =
        document.createElement("div");

    kopf.className =
        "versuch-kopf";


    const reihenfolge =
        document.createElement("div");

    reihenfolge.className =
        "reihenfolge";

    reihenfolge.textContent =
        versuch.reihenfolge || "";


    const name =
        document.createElement("div");

    name.className =
        "versuch-name";

    name.textContent =
        versuch.versuch || "";


    const pfeil =
        document.createElement("div");

    pfeil.className =
        "versuch-pfeil";

    pfeil.textContent =
        "▾";


    kopf.appendChild(reihenfolge);
    kopf.appendChild(name);
    kopf.appendChild(pfeil);


    const detail =
        document.createElement("div");

    detail.className =
        "versuch-detail";


    const bildBereich =
        document.createElement("div");


    if (
        versuch.bild_vorhanden === 1
        &&
        versuch.bild
    ) {

        const bild =
            document.createElement("img");

        bild.className =
            "versuch-bild";

        bild.src =
            versuch.bild;

        bild.alt =
            versuch.versuch || "Versuchsbild";

        bildBereich.appendChild(
            bild
        );

    } else {

        const keinBild =
            document.createElement("div");

        keinBild.className =
            "kein-bild";

        keinBild.textContent =
            "Kein Bild vorhanden.";

        bildBereich.appendChild(
            keinBild
        );
    }


    const text =
        document.createElement("div");

    text.className =
        "versuch-text";

    text.textContent =
        versuch.text
        ||
        "Keine Beschreibung vorhanden.";


    detail.appendChild(
        bildBereich
    );

    detail.appendChild(
        text
    );


    versuchsElement.appendChild(
        kopf
    );

    versuchsElement.appendChild(
        detail
    );


    versuchsElement.addEventListener(
        "click",
        function() {

            const aktiv =
                versuchsElement
                    .classList
                    .toggle("aktiv");

            pfeil.textContent =
                aktiv
                ? "▴"
                : "▾";
        }
    );


    return versuchsElement;
}


/*
    Einzelne Vorlesung erzeugen
*/
function erzeugeVorlesungsElement(
    indexEintrag,
    vorlesungsDaten,
    istVergleich,
    istVergangen
) {

    const element =
        document.createElement("div");

    element.className =
        "vorlesung";


    if (istVergleich) {

        element.classList.add(
            "vergleich"
        );
    }


    if (istVergangen) {

        element.classList.add(
            "vergangen"
        );
    }


    const kopf =
        document.createElement("div");

    kopf.className =
        "vorlesung-kopf";


    const titel =
        document.createElement("h2");

    titel.textContent =
        "Vorlesung "
        + vorlesungsDaten.vorlesung;


    const hinweis =
        document.createElement("div");

    hinweis.className =
        "serie-hinweis";


    if (istVergleich) {

        hinweis.classList.add(
            "vergleich"
        );

        hinweis.textContent =
            "Vergleichsserie";

    } else {

        hinweis.textContent =
            "Stammserie "
            + indexEintrag.stammserie;
    }


    kopf.appendChild(
        titel
    );

    kopf.appendChild(
        hinweis
    );

    element.appendChild(
        kopf
    );


    for (
        const lektion
        of vorlesungsDaten.lektionen
    ) {

        const lektionsElement =
            document.createElement("div");

        lektionsElement.className =
            "lektion";


        const titel =
            document.createElement("h3");

        titel.textContent =
            "Lektion "
            + lektion.lektion;


        lektionsElement.appendChild(
            titel
        );


        for (
            const versuch
            of lektion.versuche
        ) {

            lektionsElement.appendChild(
                erzeugeVersuchsElement(
                    versuch
                )
            );
        }


        element.appendChild(
            lektionsElement
        );
    }


    return element;
}


/*
    Hauptfunktion
*/
async function ladePlanung() {

    try {

        const status =
            document.getElementById(
                "status"
            );

        const container =
            document.getElementById(
                "inhalt"
            );

        const heute =
            heuteOhneUhrzeit();


        const indexAntwort =
            await fetch(
                "index.json",
                { cache: "no-store" }
            );


        if (!indexAntwort.ok) {

            throw new Error(
                "index.json konnte nicht geladen werden."
            );
        }


        const index =
            await indexAntwort.json();


        /*
            Index chronologisch sortieren
        */
        const eintraege =
            [...index.vorlesungen];


        eintraege.sort(
            function(a, b) {

                return (
                    datumAusDeutsch(a.datum)
                    -
                    datumAusDeutsch(b.datum)
                );
            }
        );


        /*
            Nach Datum gruppieren
        */
        const gruppen =
            new Map();


        for (const eintrag of eintraege) {

            if (
                !gruppen.has(
                    eintrag.datum
                )
            ) {

                gruppen.set(
                    eintrag.datum,
                    []
                );
            }


            gruppen
                .get(eintrag.datum)
                .push(eintrag);
        }


        let naechsterTagGefunden =
            false;


        for (
            const [datumText, tagEintraege]
            of gruppen
        ) {

            const tagDatum =
                datumAusDeutsch(
                    datumText
                );

            const istVergangen =
                tagDatum
                &&
                tagDatum < heute;


            const tagElement =
                document.createElement("section");

            tagElement.className =
                "tag";


            if (
                !naechsterTagGefunden
                &&
                tagDatum
                &&
                tagDatum >= heute
            ) {

                tagElement.classList.add(
                    "naechster-tag"
                );

                naechsterTagElement =
                    tagElement;

                naechsterTagGefunden =
                    true;
            }


            const marker =
                document.createElement("div");

            marker.className =
                "tag-marker";

            marker.textContent =
                "NÄCHSTE VORLESUNG";


            const datumTitel =
                document.createElement("div");

            datumTitel.className =
                "tag-datum";

            datumTitel.textContent =
                datumText;


            const grid =
                document.createElement("div");

            grid.className =
                "vorlesungs-grid";


            /*
                Alle Vorlesungsdateien
                dieses Datums laden
            */
            const daten =
                await Promise.all(

                    tagEintraege.map(
                        ladeVorlesungsDatei
                    )
                );


            /*
                Entscheiden:
                gibt es an diesem Datum
                ein Vergleichspaar?
            */
            let vergleichsPaar =
                false;


            if (
                tagEintraege.length === 2
                &&
                serienGehörenZusammen(
                    tagEintraege[0],
                    tagEintraege[1]
                )
            ) {

                vergleichsPaar =
                    true;

                grid.classList.add(
                    "zwei"
                );
            }


            for (
                let i = 0;
                i < tagEintraege.length;
                i++
            ) {

                const eintrag =
                    tagEintraege[i];

                const vorlesungsDaten =
                    daten[i];


                /*
                    Bei einem Vergleichspaar:
                    erste = Stammserie
                    zweite = Vergleichsserie
                */
                const istVergleich =
                    vergleichsPaar
                    &&
                    i === 1;


                const vorlesungsElement =
                    erzeugeVorlesungsElement(
                        eintrag,
                        vorlesungsDaten,
                        istVergleich,
                        istVergangen
                    );


                grid.appendChild(
                    vorlesungsElement
                );
            }


            tagElement.appendChild(
                marker
            );

            tagElement.appendChild(
                datumTitel
            );

            tagElement.appendChild(
                grid
            );


            container.appendChild(
                tagElement
            );
        }


        status.textContent =
            "Alle Vorlesungsdaten erfolgreich geladen.";


        /*
            Button und automatischer Sprung
        */
        if (naechsterTagElement) {

            const button =
                document.getElementById(
                    "zurNaechsten"
                );

            button.style.display =
                "inline-block";


            button.addEventListener(
                "click",
                function() {

                    naechsterTagElement
                        .scrollIntoView({
                            behavior: "smooth",
                            block: "start"
                        });
                }
            );


            setTimeout(
                function() {

                    naechsterTagElement
                        .scrollIntoView({
                            behavior: "auto",
                            block: "start"
                        });

                },
                100
            );
        }

    }

    catch (fehler) {

        document.getElementById(
            "status"
        ).textContent =
            "Fehler beim Laden.";


        document.getElementById(
            "fehler"
        ).textContent =
            fehler.message;


        console.error(
            fehler
        );
    }
}


ladePlanung();

</script>

</body>
</html>
